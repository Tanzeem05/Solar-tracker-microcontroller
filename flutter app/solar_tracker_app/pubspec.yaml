name: solar_tracker_app
description: Offline Bluetooth Classic dashboard for an HC-05 solar tracker.
publish_to: none
version: 1.1.1+3
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_classic_bluetooth: 1.5.0
dependency_overrides:
  flutter_classic_bluetooth:
    path: vendor/flutter_classic_bluetooth
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
flutter:
  uses-material-design: true
